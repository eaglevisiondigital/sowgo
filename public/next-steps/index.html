<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Resources and Next Steps | SowGo</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .holding-page{max-width:800px;padding-block:32px 56px}.holding-logo{width:210px;margin-bottom:42px}.holding-page h1{font-size:clamp(36px,7vw,62px);margin:12px 0 20px}.holding-page h2{font-size:26px;letter-spacing:-.025em}.holding-card{margin-top:28px;padding:26px;border:1px solid var(--line);border-radius:var(--radius);background:var(--pale)}.holding-card h2{margin-bottom:12px}.holding-page .actions{margin-top:24px}.holding-page footer{margin-top:34px;font-size:14px}@media(max-width:600px){.holding-page{width:calc(100% - 32px)}.holding-card{padding:22px}.holding-page .actions .button{width:100%}}
  </style>
</head>
<body>
  <main class="container holding-page">
    <a href="/" aria-label="SowGo home"><img class="holding-logo" src="/assets/images/sowgo-logo.png" alt="SowGo"></a>
    <p class="eyebrow">Resources and next steps</p>
    <h1>Grow in your faith</h1>
    <p>Explore discipleship resources and prayer through Champion Life.</p>
    <section class="holding-card" aria-labelledby="discipleship-heading">
      <h2 id="discipleship-heading">Discipleship resources</h2>
      <p>Explore Getting a Grip on the Basics.</p>
      <div class="actions"><a class="button button-primary" href="https://championlifefwb.com/getting-a-grip.html">Explore discipleship</a></div>
    </section>
    <section class="holding-card" aria-labelledby="prayer-heading">
      <h2 id="prayer-heading">Prayer</h2>
      <p>Visit Champion Life's prayer page.</p>
      <div class="actions"><a class="button button-outline" href="https://championlifefwb.com/prayer.html">Visit the prayer page</a></div>
    </section>
    <footer><a class="text-link" href="/">Return to SowGo</a></footer>
  </main>
</body>
</html>
