[build]
  publish = "dist-public"
  command = "node tools/build-partner-site.mjs"
# The complete static source remains in public/; production adds only public partner settings.
# No package installation, archive download, functions, or database connection is required.
# Keep this deployment separate from Champion Life.

# Only unpublished candidates replace the preregistration origin with acceptance.
[context.deploy-preview]
  command = "node tools/build-register-preview.mjs"
  publish = "preview-public"
[context.branch-deploy]
  command = "node tools/build-register-preview.mjs"
  publish = "preview-public"
