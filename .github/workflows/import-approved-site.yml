name: Import approved SowGo website

on:
  push:
    branches: [main]
    paths: [.github/workflows/import-approved-site.yml, tools/restore-approved-site.py]

permissions:
  contents: write

concurrency:
  group: sowgo-approved-site-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'eaglevisiondigital/sowgo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out only the SowGo repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Import the approved public website archive
        env:
          # One-time file-scoped download of the already-approved public site bundle.
          SOWGO_APPROVED_ARCHIVE_URL: 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-cc00-822f-bfd0-fa20cdc0ced1/raw?se=2026-10-02T06%3A36%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=a0ff3161-5067-52b6-b10b-ce204de7e9bb&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T01%3A11%3A53Z&ske=2026-10-03T01%3A11%3A53Z&sks=b&skv=2026-02-06&sig=5RDoDZoGdIqbfBdXqnATy9cRbditpiYRPYwHe3nxZa4%3D'
        run: |
          printf '::add-mask::%s\n' "$SOWGO_APPROVED_ARCHIVE_URL"
          python3 tools/restore-approved-site.py
          node --check public/site.js
          node --check public/site-data.js
      - name: Commit only the approved website files
        run: |
          git add -- public
          if git diff --cached --quiet; then
            echo 'Approved website files already exist; no changes required.'
            exit 0
          fi
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 27
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add all 27 hash-verified approved SowGo website files'
          git push origin HEAD:main
