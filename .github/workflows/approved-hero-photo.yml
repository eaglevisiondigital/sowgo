name: Approved SowGo hero photo
on:
  push:
    branches: [build/approved-hero-photo-20261002]
    paths: [.github/workflows/approved-hero-photo.yml]
permissions:
  contents: write
concurrency:
  group: sowgo-approved-hero-photo
  cancel-in-progress: false
jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build/approved-hero-photo-20261002
          fetch-depth: 0
      - name: Install image and browser test tools
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Prepare only the approved hero replacement
        run: |
          python - <<'PY'
          import hashlib, io, json, re, subprocess, urllib.request
          from pathlib import Path
          from PIL import Image
          base = 'f40e34c24f93b9609020f95c5d6f860b69b5f650'
          assert subprocess.check_output(['git','rev-parse','origin/main'], text=True).strip() == base, 'Main changed; reconcile before proceeding'
          source_url = 'https://raw.githubusercontent.com/eaglevisiondigital/championlife/main/assets/images/outreach-hero-20260807.jpg'
          with urllib.request.urlopen(source_url, timeout=40) as response:
              original = response.read()
          original_sha = hashlib.sha256(original).hexdigest()
          assert original_sha == 'd93749a6ab182973493de6c3f97060a35210e6f18424cc857be8780880f91b49', 'Not the exact user-approved original'
          assert hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest() == '6aad12c5b17647cc79404735ad179a0c31ea4a7b'
          im = Image.open(io.BytesIO(original))
          assert im.size == (1264,600)
          asset = Path('public/assets/images/hero-outreach-approved-20261002.webp')
          im.convert('RGB').save(asset, format='WEBP', quality=92, method=6)
          assert Image.open(asset).size == (1264,600)
          html_file = Path('public/index.html')
          old = html_file.read_text()
          baseline = subprocess.check_output(['git','show',base+':public/index.html'], text=True)
          assert old == baseline
          old_img = '<img class="hero-image" src="assets/images/hero.webp" width="303" height="247" alt="Illustrative design photograph of an outdoor outreach gathering" fetchpriority="high">'
          new_img = '<img class="hero-image" src="assets/images/hero-outreach-approved-20261002.webp" width="1264" height="600" alt="A speaker on an outdoor stage addressing the crowd at a Champion Life outreach" fetchpriority="high">'
          assert old.count(old_img) == 1
          new = old.replace(old_img, new_img)
          old_preload = '<link rel="preload" as="image" href="assets/images/hero.webp">'
          assert new.count(old_preload) == 1
          new = new.replace(old_preload, '<link rel="preload" as="image" href="assets/images/hero-outreach-approved-20261002.webp">')
          new = new.replace('Photography and funding indicators are placeholders.', 'Some photography and funding indicators remain placeholders.')
          marker = '    <section class="pillars"'
          assert new.split(marker,1)[1] == old.split(marker,1)[1], 'Content below the hero changed'
          assert re.findall(r'<a\b[^>]*href="([^"]*)"', new) == re.findall(r'<a\b[^>]*href="([^"]*)"', old), 'Navigation or destinations changed'
          html_file.write_text(new)
          css_file = Path('public/styles.css')
          old_css = css_file.read_text()
          assert old_css == subprocess.check_output(['git','show',base+':public/styles.css'], text=True)
          css = '''
          /* Approved authentic hero photograph, October 2, 2026.
             Keep the original image intact; use only CSS framing and a readable overlay.
             All rules below are restricted to the hero. */
          .hero .hero-image{inset:0;width:100%;height:100%;object-fit:cover;object-position:40% 55%;mask-image:none;-webkit-mask-image:none}
          .hero .hero-shade{background:linear-gradient(90deg,#031d31f5 0%,#031d31df 29%,#031d3199 47%,#031d3120 75%),linear-gradient(0deg,#031d3166 0%,transparent 55%)}
          @media(min-width:601px) and (max-width:1023px){.hero .hero-image{object-position:30% 55%}}
          @media(max-width:600px){.hero .hero-image{inset:0 0 auto;width:100%;height:360px;object-position:60% 40%}.hero .hero-shade{background:linear-gradient(180deg,#05273f12 0,#05273f24 150px,#05273fe8 255px,#05273f 355px)}.hero .hero-content{padding-top:246px}}
          '''
          css_file.write_text(old_css+'\n'+css)
          asset_sha = hashlib.sha256(asset.read_bytes()).hexdigest()
          doc = f'''# Approved hero photograph replacement\n\nDave approved the hero photograph on October 2, 2026.\n\n## Source and authenticity\n\n- User upload: `Edited-202 (1)(2).jpg`, 1264 x 600 pixels.\n- The upload is byte-identical to Champion Life's existing `assets/images/outreach-hero-20260807.jpg`.\n- Original SHA-256: `{original_sha}`.\n- Original Git blob: `6aad12c5b17647cc79404735ad179a0c31ea4a7b`.\n- Source: {source_url}\n- Website asset: `public/assets/images/hero-outreach-approved-20261002.webp`.\n- Website asset SHA-256: `{asset_sha}`.\n- The photograph was encoded as WebP without cropping, retouching, redrawing, generative fill, or changes to people. Only website CSS supplies the framing and navy overlay. The original remains in the Champion Life repository and conversation upload.\n\n## Scope\n\nBase: `{base}`. Preserve the existing SowGo logo, navigation, hero wording and buttons, all lower page sections, event data, partner and sowing links, review notices, and noindex protection. The gallery's separate temporary image is not replaced in this package.\n\nThe new asset, hero image metadata/preload, hero-only responsive CSS, and qualified photography review notice are the only public changes. Champion Life production, the shared backend, acceptance work, payment routing, DNS and the empty earlier Netlify project are unchanged.\n\n## Validation and release\n\nLocal browser screenshots and checks run at widths 320, 375, 390, 768, 1024, 1440 and 1920. Checks include the real hero image dimensions, no horizontal overflow, no browser errors, unchanged links, and byte-identical content below the hero. Evidence is retained in the `sowgo-hero-local-review` Actions artifact.\n\nThe preparation job commits to an isolated review branch, not main. Promotion is a separate non-forced main update after screenshot review. After promotion, the same run verifies HTML and image bytes on the existing `sowgosite.netlify.app` review site and records actual hosted screenshots in the `sowgo-hero-hosted-review` artifact. A failed or incomplete hosted check is not a passed launch. No custom-domain cutover is included.\n'''
          Path('docs/HERO-PHOTO-APPROVAL-20261002.md').write_text(doc)
          Path('/tmp/sowgo-hero-evidence').mkdir(exist_ok=True)
          Path('/tmp/sowgo-hero-evidence/provenance.json').write_text(json.dumps({'original_sha256':original_sha,'webp_sha256':asset_sha,'image_dimensions':im.size,'webp_bytes':asset.stat().st_size,'below_hero_byte_identical':True,'anchor_destinations_unchanged':True},indent=2))
          print('Exact approved original verified. WebP bytes:',asset.stat().st_size)
          PY
          node --check public/site.js
          node --check public/site-data.js
          git diff --check
      - name: Local responsive browser checks and screenshots
        run: |
          python - <<'PY'
          import functools, http.server, json, threading
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out = Path('/tmp/sowgo-hero-evidence')
          handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory='public')
          server = http.server.ThreadingHTTPServer(('127.0.0.1',8765),handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          results=[]
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for width in [320,375,390,768,1024,1440,1920]:
                  page=browser.new_page(viewport={'width':width,'height':1000},device_scale_factor=1)
                  errors=[]
                  page.on('pageerror',lambda error:errors.append(str(error)))
                  page.goto('http://127.0.0.1:8765/',wait_until='networkidle')
                  assert page.locator('.hero-image').evaluate('(i)=>i.complete && i.naturalWidth===1264 && i.naturalHeight===600')
                  assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth+1'), f'Overflow at {width}'
                  for y in range(0,int(page.evaluate('document.documentElement.scrollHeight')),650):
                      page.evaluate('(y)=>window.scrollTo(0,y)',y)
                      page.wait_for_timeout(35)
                  page.evaluate('window.scrollTo(0,0)')
                  page.wait_for_timeout(250)
                  assert not errors, errors
                  if width in [375,768,1440]:
                      label={375:'mobile',768:'tablet',1440:'desktop'}[width]
                      hero=page.locator('.hero').bounding_box()
                      page.screenshot(path=str(out/f'local-hero-{label}.png'),clip={'x':0,'y':0,'width':width,'height':hero['y']+hero['height']})
                      if width==1440:
                          page.screenshot(path=str(out/'local-full-desktop.png'),full_page=True)
                  if width <1024:
                      page.locator('.menu-toggle').click()
                      assert page.locator('.menu-toggle').get_attribute('aria-expanded')=='true'
                      page.locator('.menu-toggle').click()
                      assert page.locator('.menu-toggle').get_attribute('aria-expanded')=='false'
                  results.append({'width':width,'hero_loaded':True,'no_horizontal_overflow':True,'page_errors':errors})
                  page.close()
              browser.close()
          server.shutdown()
          (out/'local-checks.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results))
          PY
      - name: Commit prepared photo update on the isolated branch only
        run: |
          git rm .github/workflows/approved-hero-photo.yml
          git add public/index.html public/styles.css public/assets/images/hero-outreach-approved-20261002.webp docs/HERO-PHOTO-APPROVAL-20261002.md
          git diff --cached --check
          git config user.name 'Eagle Vision Digital'
          git config user.email 'info@eaglevision.biz'
          git commit -m 'Use approved original outreach photograph for SowGo hero'
          git push origin HEAD:refs/heads/build/approved-hero-photo-20261002
          echo "PREPARED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git diff --stat f40e34c24f93b9609020f95c5d6f860b69b5f650 HEAD
          echo "Prepared commit: $(git rev-parse HEAD)"
      - name: Save local review evidence before release gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sowgo-hero-local-review
          path: /tmp/sowgo-hero-evidence
          retention-days: 30
      - name: Wait for separately reviewed main promotion
        run: |
          for attempt in $(seq 1 120); do
            current=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$current" = "$PREPARED_SHA" ]; then
              echo 'Reviewed main promotion detected.'
              exit 0
            fi
            if [ "$current" != 'f40e34c24f93b9609020f95c5d6f860b69b5f650' ]; then
              echo 'Main changed independently. Stop; do not overwrite.'
              exit 1
            fi
            sleep 5
          done
          echo 'Main promotion not completed; prepared change remains on isolated branch.'
          exit 1
      - name: Verify actual hosted hero and capture live screenshots
        run: |
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          root='https://sowgosite.netlify.app'
          asset='assets/images/hero-outreach-approved-20261002.webp'
          expected=hashlib.sha256(Path('public/'+asset).read_bytes()).hexdigest()
          success=False
          for attempt in range(48):
              try:
                  with urllib.request.urlopen(root+'/?hero-review=20261002',timeout=15) as r:
                      html=r.read().decode()
                  with urllib.request.urlopen(root+'/'+asset,timeout=15) as r:
                      data=r.read()
                  if asset in html and hashlib.sha256(data).hexdigest()==expected:
                      success=True
                      break
              except Exception:
                  pass
              time.sleep(5)
          assert success,'New hosted HTML and photo bytes have not verified'
          out=Path('/tmp/sowgo-hero-hosted');out.mkdir(exist_ok=True)
          results=[]
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for width,label in [(1440,'desktop'),(768,'tablet'),(375,'mobile')]:
                  page=browser.new_page(viewport={'width':width,'height':1000},device_scale_factor=1)
                  errors=[]
                  page.on('pageerror',lambda error:errors.append(str(error)))
                  response=page.goto(root+'/?hero-review=20261002',wait_until='networkidle',timeout=60000)
                  assert response.status==200
                  assert page.locator('.hero-image').evaluate('(i)=>i.complete && i.naturalWidth===1264 && i.naturalHeight===600')
                  assert page.evaluate('document.documentElement.scrollWidth<=window.innerWidth+1')
                  for y in range(0,int(page.evaluate('document.documentElement.scrollHeight')),650):
                      page.evaluate('(y)=>window.scrollTo(0,y)',y)
                      page.wait_for_timeout(50)
                  page.evaluate('window.scrollTo(0,0)');page.wait_for_timeout(300)
                  assert not errors, errors
                  hero=page.locator('.hero').bounding_box()
                  page.screenshot(path=str(out/f'hosted-hero-{label}.png'),clip={'x':0,'y':0,'width':width,'height':hero['y']+hero['height']})
                  if width==1440:
                      page.screenshot(path=str(out/'hosted-full-desktop.png'),full_page=True)
                  results.append({'width':width,'url':root,'http_status':response.status,'hero_loaded':True,'no_horizontal_overflow':True,'page_errors':errors})
                  page.close()
              browser.close()
          (out/'hosted-checks.json').write_text(json.dumps({'url':root,'photo_sha256':expected,'html_and_image_verified':True,'responsive_checks':results},indent=2))
          print(json.dumps(results))
          PY
      - name: Save hosted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sowgo-hero-hosted-review
          path: /tmp/sowgo-hero-hosted
          if-no-files-found: ignore
          retention-days: 30
