name: Isolated outreach QR router checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: eaglevisiondigital/championlife
          ref: e1f75f917f9a1e6e16e0b8f9bc5d7b52fbf0a424
          path: tools/baseline-checkout
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
        env:
          CHAMPION_LIFE_BASELINE: tools/baseline-checkout
